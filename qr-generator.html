<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Mã QR Dễ Thương - Phong Tình</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-100 to-pink-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/90 backdrop-blur-xl rounded-[40px] p-8 sm:p-12 shadow-2xl border-4 border-white max-w-lg w-full text-center">
        <h1 class="text-3xl font-extrabold text-sky-950 mb-2">Tạo Mã QR Thần Tiên ☁️</h1>
        <p class="text-sky-700 font-medium mb-8">Dán link Vercel của bạn vào đây để tạo mã QR siêu cute nhé!</p>

        <input type="text" id="urlInput" placeholder="https://dktcnh-phongtinh.vercel.app" 
            class="w-full bg-slate-50 border-2 border-sky-200 rounded-2xl px-5 py-4 text-sky-900 placeholder-sky-300 focus:outline-none focus:ring-4 focus:ring-pink-300/50 focus:border-pink-300 transition-all font-bold text-center mb-6 shadow-inner" />

        <div id="qrContainer" class="flex justify-center mb-8 bg-sky-50 rounded-[32px] p-8 border-2 border-dashed border-sky-200">
            <!-- QR code will be generated here -->
        </div>

        <button onclick="generateQR()" class="w-full bg-gradient-to-r from-sky-400 to-pink-400 hover:from-sky-300 hover:to-pink-300 text-white font-extrabold py-4 px-8 rounded-2xl transition-all shadow-[0_10px_25px_rgba(236,72,153,0.3)] mb-4 active:scale-95">
            ✨ Tạo Mã QR ✨
        </button>

        <button onclick="downloadQR()" id="downloadBtn" class="w-full bg-white text-sky-500 border-2 border-sky-300 font-extrabold py-4 px-8 rounded-2xl transition-all shadow-md hover:bg-sky-50 hidden active:scale-95">
            📥 Tải Mã QR Xịn Xò Về Máy
        </button>
    </div>

    <script>
        const qrCode = new QRCodeStyling({
            width: 300,
            height: 300,
            data: "https://example.com",
            margin: 10,
            qrOptions: {
                typeNumber: 0,
                mode: "Byte",
                errorCorrectionLevel: "H"
            },
            imageOptions: {
                hideBackgroundDots: true,
                imageSize: 0.4,
                margin: 5,
                crossOrigin: "anonymous",
            },
            dotsOptions: {
                type: "rounded",
                gradient: {
                    type: "linear",
                    rotation: 45,
                    colorStops: [
                        { offset: 0, color: "#38bdf8" }, // Sky 400
                        { offset: 1, color: "#f472b6" }  // Pink 400
                    ]
                }
            },
            backgroundOptions: {
                color: "#ffffff",
            },
            image: "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Teddy%20bear/3D/teddy_bear_3d.png", // Cute Bear Logo
            cornersSquareOptions: {
                type: "extra-rounded",
                color: "#0284c7" // Sky 600
            },
            cornersDotOptions: {
                type: "dot",
                color: "#db2777" // Pink 600
            }
        });

        // Generate initial empty/placeholder QR
        qrCode.append(document.getElementById("qrContainer"));

        function generateQR() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert("Bạn nhập link Vercel vào trước nha! 🥺");
                return;
            }

            qrCode.update({
                data: url
            });
            
            document.getElementById('downloadBtn').classList.remove('hidden');
        }

        function downloadQR() {
            qrCode.download({
                name: "QR_Thiệp_Mời_PhongTinh",
                extension: "png"
            });
        }
    </script>
</body>
</html>
